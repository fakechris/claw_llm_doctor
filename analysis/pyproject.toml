[project]
name = "claw-llm-doctor"
version = "0.1.0"
description = "Analysis engine for claw_llm_doctor — diagnose OpenClaw LLM Provider behaviour"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click",
    "rich",
    "orjson",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken",
]

[project.scripts]
claw-doctor = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
