[project]
name = "claw-llm-doctor"
version = "0.1.0"
description = "Analysis engine for OpenClaw LLM diagnostic logs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
full = [
    "tiktoken>=0.7",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
claw-doctor = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
